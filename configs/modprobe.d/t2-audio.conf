# T2 Audio Configuration
# Install to: /etc/modprobe.d/t2-audio.conf
#
# After installation:
# sudo modprobe -r snd_hda_intel
# sudo modprobe snd_hda_intel

# Use automatic model detection
options snd_hda_intel model=auto

# Disable digital microphone detection
# This prevents audio issues on some models
options snd_hda_intel dmic_detect=0

# Disable power saving to prevent audio dropouts
# Set to 1 to enable (may cause occasional audio issues)
options snd_hda_intel power_save=0

# Enable all audio codecs
# T2 MacBooks use Cirrus Logic CS8409 codec
options snd_hda_codec_cs8409 index=0

# Additional debugging (uncomment if troubleshooting)
# options snd_hda_intel debug=1
