# T2 Input Devices Configuration
# Install to: /etc/modprobe.d/t2-input.conf
#
# After installation:
# sudo modprobe -r apple_ib_tb hid_apple
# sudo modprobe apple_ib_tb hid_apple
# sudo update-initramfs -u

# Apple iBridge (T2) Keyboard and Touchbar Configuration

# Function key mode:
# 0 = disabled
# 1 = F1-F12 are media keys (default macOS behavior)
# 2 = F1-F12 are function keys (requires Fn for media)
options apple_ib_tb fnmode=2

# ISO keyboard layout (0 = ANSI, 1 = ISO)
# Set to 1 if you have a non-US keyboard
options apple_ib_tb iso_layout=0

# HID Apple driver options (for older models)
options hid_apple fnmode=2
options hid_apple iso_layout=0

# Swap Command and Option keys (uncomment if desired)
# options hid_apple swap_opt_cmd=1
