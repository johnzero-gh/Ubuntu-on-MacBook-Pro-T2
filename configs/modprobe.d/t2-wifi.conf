# T2 WiFi Configuration
# Install to: /etc/modprobe.d/t2-wifi.conf
#
# After installation:
# sudo modprobe -r brcmfmac
# sudo modprobe brcmfmac
# sudo systemctl restart NetworkManager

# Broadcom WiFi driver options for T2 MacBooks

# Disable debug logging (0 = off, 1 = on)
options brcmfmac debug=0

# Disable roaming to improve connection stability
options brcmfmac roamoff=1

# Feature flags (uncomment if needed)
# options brcmfmac feature_disable=0x82000

# Alternative: If using proprietary wl driver instead
# Uncomment below and blacklist brcmfmac

# options wl ignore_probe_fail=1
# blacklist brcmfmac
# blacklist brcmsmac
# blacklist bcma
# blacklist ssb
