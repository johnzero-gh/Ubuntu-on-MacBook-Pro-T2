# TLP Configuration for T2 MacBook Pro
# Install to: /etc/tlp.conf
#
# After installation:
# sudo tlp start

# ------------------------------------------------------------------------------
# Battery Thresholds (for battery health)
# Stop charging at 80% to prolong battery life
# Only applies to some models - may not work on all T2 MacBooks

START_CHARGE_THRESH_BAT0=75
STOP_CHARGE_THRESH_BAT0=80

# ------------------------------------------------------------------------------
# CPU Settings

# CPU scaling governor
# performance: Maximum performance, higher power usage
# powersave: Lower performance, better battery life
CPU_SCALING_GOVERNOR_ON_AC=performance
CPU_SCALING_GOVERNOR_ON_BAT=powersave

# CPU energy/performance policy
# performance: Maximum performance
# balance_performance: Balanced toward performance
# balance_power: Balanced toward power saving
# power: Maximum power saving
CPU_ENERGY_PERF_POLICY_ON_AC=performance
CPU_ENERGY_PERF_POLICY_ON_BAT=power

# CPU boost (turbo boost)
# 0 = disable, 1 = enable
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0

# Minimum and maximum CPU frequency
# Uncomment and adjust if needed
# CPU_SCALING_MIN_FREQ_ON_AC=800000
# CPU_SCALING_MAX_FREQ_ON_AC=3800000
# CPU_SCALING_MIN_FREQ_ON_BAT=800000
# CPU_SCALING_MAX_FREQ_ON_BAT=2400000

# ------------------------------------------------------------------------------
# Intel GPU Settings

# GPU frequency limits (in MHz)
INTEL_GPU_MIN_FREQ_ON_AC=300
INTEL_GPU_MIN_FREQ_ON_BAT=300
INTEL_GPU_MAX_FREQ_ON_AC=1200
INTEL_GPU_MAX_FREQ_ON_BAT=800
INTEL_GPU_BOOST_FREQ_ON_AC=1200
INTEL_GPU_BOOST_FREQ_ON_BAT=1000

# ------------------------------------------------------------------------------
# Radio Device Settings

# WiFi power saving
# on: Enable power saving (may reduce performance)
# off: Disable power saving (better performance)
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on

# Bluetooth
# on: Enable, off: Disable
# Enable on both AC and battery by default
DEVICES_TO_DISABLE_ON_STARTUP=""

# Enable on AC, disable on battery (uncomment to use)
# DEVICES_TO_DISABLE_ON_BAT="bluetooth"

# ------------------------------------------------------------------------------
# PCIe Runtime Power Management

# auto: Enable aggressive power saving
# on: Enable power saving
# off: Disable power saving
RUNTIME_PM_ON_AC=on
RUNTIME_PM_ON_BAT=auto

# ------------------------------------------------------------------------------
# Disk Settings

# SATA link power management
# max_performance: Maximum performance
# medium_power: Balanced
# min_power: Maximum power saving
SATA_LINKPWR_ON_AC=max_performance
SATA_LINKPWR_ON_BAT=medium_power

# NVMe power saving (most T2 MacBooks use NVMe SSDs)
# Uncomment to enable
# AHCI_RUNTIME_PM_ON_AC=on
# AHCI_RUNTIME_PM_ON_BAT=auto

# ------------------------------------------------------------------------------
# USB Settings

# USB autosuspend
# 0 = disable, 1 = enable
USB_AUTOSUSPEND=1

# Exclude devices that don't work well with autosuspend
# Add device IDs as needed
USB_BLACKLIST=""

# Example: Exclude Apple internal devices
# USB_BLACKLIST="05ac:*"

# ------------------------------------------------------------------------------
# Audio Settings

# Audio power saving timeout (in seconds)
# 0 = disable, 1+ = enable with timeout
# Disabled by default to prevent audio issues
SOUND_POWER_SAVE_ON_AC=0
SOUND_POWER_SAVE_ON_BAT=0

# If you want to enable audio power saving (may cause issues):
# SOUND_POWER_SAVE_ON_AC=0
# SOUND_POWER_SAVE_ON_BAT=1

# ------------------------------------------------------------------------------
# Display Settings

# Enable/disable display power management
# Uncomment to use
# RUNTIME_PM_DRIVER_BLACKLIST="nouveau radeon amdgpu"

# ------------------------------------------------------------------------------
# Additional Settings

# Enable laptop mode (advanced disk power management)
# Only activate on battery
DISK_IDLE_SECS_ON_AC=0
DISK_IDLE_SECS_ON_BAT=2

# Resume from suspend requires USB HID devices to work
# Keep USB devices from suspending during shutdown
USB_AUTOSUSPEND_DISABLE_ON_SHUTDOWN=1

# Verbose logging (for troubleshooting)
# 0 = disabled, 1 = enabled
TLP_DEBUG_LOG=0

# Note: Restart TLP after changes:
# sudo tlp start
